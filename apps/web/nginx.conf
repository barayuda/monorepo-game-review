server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Jangan umumkan versi nginx yang dipakai.
	server_tokens off;

	# Bundle SPA dikirim mentah tanpa ini; kompresi memangkasnya sekitar dua pertiga.
	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
		text/plain
		text/css
		application/javascript
		application/json
		image/svg+xml
		font/woff2;

	# 'unsafe-inline' pada style diperlukan karena Tailwind v4 menyuntik elemen style saat runtime.
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

	# Aset ber-hash aman disimpan lama; index.html tidak boleh, atau pengguna
	# memegang SPA lama yang menunjuk hash yang sudah tidak ada.
	# add_header pada location bersarang membuang header dari server block,
	# sehingga header keamanan diulang di sini dengan sengaja.
	location /assets/ {
		expires 1y;
		add_header Cache-Control 'public, immutable' always;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
	}

	location = /index.html {
		add_header Cache-Control 'no-cache' always;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
	}

	location /api/ {
		# Tanpa suffix URI, Nginx mempertahankan prefix /api milik kontrak backend.
		proxy_pass http://api:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
