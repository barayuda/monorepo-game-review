name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage thresholds
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Font yang diinline sebagai data: URI diblokir oleh `font-src 'self'`
      # pada CSP yang disajikan Nginx, dan kegagalannya hanya terlihat di
      # console browser. Artefak build diperiksa langsung agar tidak terulang.
      - name: No CSP-blocked inline fonts
        run: |
          if grep -rq 'data:font' apps/web/dist/assets/*.css; then
            echo "A font was inlined as a data: URI, which the Nginx CSP blocks." >&2
            exit 1
          fi

  e2e:
    name: End-to-end acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Run acceptance flow
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # README menyuruh reviewer menjalankan perintah ini, jadi CI harus membuktikannya bisa.
      - name: Build images
        run: docker compose build

  deploy:
    name: Deploy to Render
    needs: [quality, e2e, docker]
    # Deploy hanya setelah ketiga gate hijau, dan hanya dari main. Inilah alasan
    # `autoDeploy` dimatikan di render.yaml: tanpa itu Render akan men-deploy
    # setiap push tanpa peduli hasil CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Render deploys
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          # Fork dan checkout tanpa secret tetap lulus CI alih-alih gagal pada
          # langkah yang memang tidak bisa mereka jalankan.
          if [ -z "$API_HOOK" ] || [ -z "$WEB_HOOK" ]; then
            echo "::notice::Render deploy hooks are not configured; skipping deploy."
            exit 0
          fi
          # API lebih dulu supaya backend sudah dalam perjalanan saat frontend
          # ditukar; keduanya tetap diproses Render secara asinkron.
          curl -fsS -X POST "$API_HOOK" > /dev/null
          curl -fsS -X POST "$WEB_HOOK" > /dev/null
          echo "Render deploys triggered."
